name: Deploy to Hugging Face Space

# Every push to main rebuilds the Space folder and uploads it to huggingface.co/spaces/RajTheBuilder/ReturnGuard.
# Needs one repository secret: HF_TOKEN (a Hugging Face access token with write permission).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Space folder
        run: python deploy/huggingface/prepare_space.py
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          hf upload RajTheBuilder/ReturnGuard build/hf_space . --repo-type space --commit-message "Deploy ${GITHUB_SHA::7}"
